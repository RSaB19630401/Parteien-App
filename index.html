<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parteien-Informationsportal</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --text: #1f2430; --muted: #6b7280;
    --border: #e3e6ea; --accent: #2b5fa8; --accent-soft: #eaf1fb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); line-height: 1.5; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 16px; }
  header h1 { font-size: 1.5rem; margin: 0 0 4px; }
  header p { color: var(--muted); margin: 0; font-size: .9rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
          padding: 16px; margin: 16px 0; }
  .warn { background: #fff7e6; border-color: #ffd591; color: #874d00; font-size: .9rem; }
  .modus { display: flex; gap: 8px; margin: 16px 0; }
  .modus button { flex: 1; padding: 12px; border: 2px solid var(--border); background: #fff;
    border-radius: 10px; cursor: pointer; font-size: .95rem; font-weight: 600; color: var(--muted); }
  .modus button.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .parteien { display: flex; flex-wrap: wrap; gap: 8px; }
  .partei-btn { display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border: 2px solid var(--border); background: #fff; border-radius: 999px;
    cursor: pointer; font-size: .9rem; transition: all .15s; }
  .partei-btn:hover { border-color: var(--accent); }
  .partei-btn.active { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .tab { padding: 8px 14px; border: none; background: transparent; cursor: pointer;
    border-bottom: 3px solid transparent; color: var(--muted); font-size: .95rem; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .searchrow { display: flex; gap: 8px; margin-top: 12px; }
  .searchrow input { flex: 1; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 1rem; }
  .btn { padding: 10px 16px; background: var(--accent); color: #fff; border: none;
    border-radius: 8px; cursor: pointer; font-size: .95rem; }
  .btn:disabled { background: #9bb3d4; cursor: default; }
  .item { border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 10px; }
  .item h3 { margin: 0 0 6px; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
  .item p { margin: 0 0 8px; }
  .item .meta { color: var(--muted); font-size: .85rem; }
  .item a { color: var(--accent); text-decoration: none; font-size: .9rem; font-weight: 600; }
  .item a:hover { text-decoration: underline; }
  .quelle { display: inline-block; margin-top: 8px; }
  .abschnitt { margin: 4px 0 10px; font-size: 1.05rem; }
  .empty, .loading { text-align: center; color: var(--muted); padding: 24px; }
  .feldlabel { display: block; font-size: .75rem; color: var(--muted); margin-bottom: 6px;
    text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .ministerium-select { width: 100%; padding: 12px; border: 2px solid var(--border);
    border-radius: 10px; font-size: 1rem; background: #fff; color: var(--text); }
  .subtabs { margin-top: 6px; border-top: 1px solid var(--border); padding-top: 8px; }
  .tab.leer { color: #b8bcc4; cursor: default; }
  .tab:disabled { cursor: default; }
  .badge-arbeit { display: inline-block; margin-left: 6px; font-size: .7rem; color: #9aa0a8;
    border: 1px solid var(--border); border-radius: 999px; padding: 1px 7px; vertical-align: middle; }
  .biglink { display: inline-block; margin-top: 8px; padding: 10px 16px;
    background: var(--accent-soft); color: var(--accent); border-radius: 8px;
    text-decoration: none; font-weight: 600; }
  footer { color: var(--muted); font-size: .8rem; text-align: center; padding: 24px 0; }
  .backlink { background: none; border: none; color: var(--accent); cursor: pointer;
    font-size: .9rem; font-weight: 600; padding: 0 0 10px; }
  .thema-titel { margin: 0 0 4px; font-size: 1.3rem; }
  .thema-context { color: var(--muted); font-size: .85rem; }
  .themen-zaehler { color: var(--muted); font-size: .8rem; margin-top: 10px; }
  .themenliste { display: flex; flex-direction: column; gap: 6px; }
  .thema-eintrag { display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    text-align: left; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
    background: #fff; cursor: pointer; transition: all .12s; width: 100%; }
  .thema-eintrag:hover { border-color: var(--accent); background: var(--accent-soft); }
  .thema-eintrag-titel { font-weight: 600; font-size: 1rem; color: var(--text); }
  .thema-eintrag-ressort { font-size: .8rem; color: var(--muted); }
  .clearbtn { padding: 10px 14px; background: #eef0f3; color: var(--muted); border: none;
    border-radius: 8px; cursor: pointer; font-size: 1rem; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
</head>
<body>
<div id="root"></div>

<script>
const { useState, useEffect } = React;
const h = React.createElement;

// ════════════════════════════════════════════════════════════════════
//  KONFIGURATION – Worker-URL (ohne Slash am Ende):
const WORKER_URL = "https://parteien-info.rsab1963.workers.dev";
// ════════════════════════════════════════════════════════════════════

const FARBEN = {
  cdu:"#121212", csu:"#0080c8", spd:"#e3000f", gruene:"#46962b", afd:"#009ee0",
  linke:"#be3075", ssw:"#003d8f", fdp:"#f4d000", bsw:"#6f2d91", volt:"#502379"
};

const FALLBACK = [
  {id:"cdu",name:"CDU",im_bundestag:true},{id:"csu",name:"CSU",im_bundestag:true},
  {id:"spd",name:"SPD",im_bundestag:true},{id:"gruene",name:"Bündnis 90/Die Grünen",im_bundestag:true},
  {id:"afd",name:"AfD",im_bundestag:true},{id:"linke",name:"Die Linke",im_bundestag:true},
  {id:"ssw",name:"SSW",im_bundestag:true},{id:"fdp",name:"FDP",im_bundestag:false},
  {id:"bsw",name:"BSW",im_bundestag:false},{id:"volt",name:"Volt",im_bundestag:false}
];

const TABS = [
  {id:"personen",label:"Personen"},
  {id:"reden",label:"Reden"},
  {id:"drucksachen",label:"Drucksachen"},
  {id:"programm",label:"Programm"},
  {id:"presse",label:"Presse / Aktuelles"},
  {id:"einordnung",label:"Einordnung"}
];

function Linkblock(props) {
  const url = props.partei[props.feld];
  if (!url) return h("div", {className:"empty"}, props.leer);
  return h("a", {className:"biglink", href:url, target:"_blank", rel:"noopener"}, props.text + " öffnen");
}

function Quellen(props) {
  return h("div", {className:"meta"},
    (props.datum ? props.datum + " · " : ""),
    "Quellen: ",
    props.quellen.map(function(q, j){
      return h("span", {key:j},
        j > 0 ? " · " : "",
        h("a", {href:q.url, target:"_blank", rel:"noopener"}, q.name)
      );
    })
  );
}

function App() {
  const konfiguriert = !WORKER_URL.includes("DEIN-WORKER");
  const [ansicht, setAnsicht] = useState("partei");

  // Einzelpartei-Ansicht
  const [parteien, setParteien] = useState(FALLBACK);
  const [aktiv, setAktiv] = useState(null);
  const [tab, setTab] = useState("personen");
  const [query, setQuery] = useState("");
  const [items, setItems] = useState(null);
  const [einordnung, setEinordnung] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  // Themenvergleich-Ansicht (Ministerium → Thema → Unterthema)
  const [ministerien, setMinisterien] = useState([]);
  const [mSel, setMSel] = useState(null);
  const [tSel, setTSel] = useState(null);
  const [uSel, setUSel] = useState(null);
  const [vergleich, setVergleich] = useState(null);
  const [vLoading, setVLoading] = useState(false);

  // Themen-Ansicht (flache, alphabetische Liste mit Suche)
  const [themenliste, setThemenliste] = useState([]);
  const [themenQuery, setThemenQuery] = useState("");
  const [themaSel, setThemaSel] = useState(null);

  useEffect(function() {
    if (!konfiguriert) return;
    fetch(WORKER_URL + "/parteien")
      .then(function(r){ return r.json(); })
      .then(function(d){ if (d.parteien) setParteien(d.parteien); })
      .catch(function(){});
    fetch(WORKER_URL + "/themenliste")
      .then(function(r){ return r.json(); })
      .then(function(d){ if (d.themen) setThemenliste(d.themen); })
      .catch(function(){});
  }, []);

  const aktivePartei = parteien.find(function(p){ return p.id === aktiv; });

  async function laden(p, t, q) {
    if (!konfiguriert) { setError("Bitte zuerst die Worker-URL im Code eintragen."); return; }
    if (t === "programm" || t === "presse") { setItems(null); setEinordnung(null); return; }
    setLoading(true); setError(""); setItems(null); setEinordnung(null);
    try {
      if (t === "einordnung") {
        const res = await fetch(WORKER_URL + "/einordnung?partei=" + encodeURIComponent(p.name));
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        setEinordnung({ amtlich: data.amtlich || [], themen: data.themen || [] });
      } else if (t === "personen") {
        const res = await fetch(WORKER_URL + "/personen?partei=" + encodeURIComponent(p.name) + "&max=80");
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        setItems(data.mandate || []);
      } else {
        const ressource = t === "reden" ? "reden" : "drucksachen";
        const res = await fetch(WORKER_URL + "/" + ressource + "?q=" + encodeURIComponent(q || "") + "&wp=21&max=25");
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        setItems(data.treffer || []);
      }
    } catch (e) {
      setError("Fehler beim Laden: " + e.message);
    } finally {
      setLoading(false);
    }
  }

  function waehlePartei(p) {
    setAktiv(p.id); setItems(null); setEinordnung(null); setError("");
    if (tab !== "programm" && tab !== "presse") laden(p, tab, query);
  }
  function waehleTab(t) {
    setTab(t); setItems(null); setEinordnung(null); setError("");
    if (aktivePartei && t !== "programm" && t !== "presse") laden(aktivePartei, t, query);
  }

  async function ladeVergleich(mId, tId, uId) {
    setMSel(mId); setTSel(tId); setUSel(uId || null);
    setVergleich(null); setVLoading(true);
    try {
      var qs = "ministerium=" + encodeURIComponent(mId) + "&thema=" + encodeURIComponent(tId);
      if (uId) qs += "&unterthema=" + encodeURIComponent(uId);
      const res = await fetch(WORKER_URL + "/vergleich?" + qs);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      setVergleich(data.positionen || []);
      if (data.unterthema_id) setUSel(data.unterthema_id);
    } catch (e) {
      setVergleich([]);
    } finally {
      setVLoading(false);
    }
  }

  function erstesUnterthema(t) {
    if (!t || !t.unterthemen.length) return null;
    var b = t.unterthemen.find(function(u){ return u.befuellt; });
    return (b || t.unterthemen[0]).id;
  }

  function waehleMinisterium(mId) {
    const m = ministerien.find(function(x){ return x.id === mId; });
    if (!m || m.status !== "aktiv" || !m.themen.length) {
      setMSel(mId); setTSel(null); setUSel(null); setVergleich(null); return;
    }
    const t = m.themen[0];
    ladeVergleich(m.id, t.id, erstesUnterthema(t));
  }
  function waehleThema(tId) {
    const m = ministerien.find(function(x){ return x.id === mSel; });
    const t = m && m.themen.find(function(x){ return x.id === tId; });
    ladeVergleich(mSel, tId, erstesUnterthema(t));
  }
  function waehleUnterthema(uId) {
    ladeVergleich(mSel, tSel, uId);
  }

  async function ladeThema(item) {
    setThemaSel(item);
    setVergleich(null); setVLoading(true);
    try {
      var qs = "ministerium=" + encodeURIComponent(item.ministerium_id) +
               "&thema=" + encodeURIComponent(item.thema_id) +
               "&unterthema=" + encodeURIComponent(item.unterthema_id);
      const res = await fetch(WORKER_URL + "/vergleich?" + qs);
      const data = await res.json();
      if (data.error) throw new Error(data.error);
      setVergleich(data.positionen || []);
    } catch (e) {
      setVergleich([]);
    } finally {
      setVLoading(false);
    }
  }
  function zurueckZurListe() {
    setThemaSel(null); setVergleich(null);
  }

  function wechsleAnsicht(a) {
    setAnsicht(a);
  }

  // ── Render: Einzelpartei ──────────────────────────────────────────────
  function renderPartei() {
    return h("div", null,
      h("div", {className:"card"},
        h("div", {className:"parteien"},
          parteien.map(function(p){
            return h("button", {
              key:p.id,
              className:"partei-btn" + (aktiv===p.id ? " active":""),
              onClick:function(){ waehlePartei(p); }
            },
              h("span", {className:"dot", style:{background:FARBEN[p.id]||"#999"}}),
              p.name
            );
          })
        )
      ),

      aktivePartei && h("div", {className:"card"},
        h("div", {className:"tabs"},
          TABS.map(function(t){
            return h("button", {
              key:t.id,
              className:"tab" + (tab===t.id ? " active":""),
              onClick:function(){ waehleTab(t.id); }
            }, t.label);
          })
        ),

        (tab==="reden" || tab==="drucksachen") && h("div", {className:"searchrow"},
          h("input", {
            value:query,
            onChange:function(e){ setQuery(e.target.value); },
            onKeyDown:function(e){ if (e.key==="Enter") laden(aktivePartei, tab, query); },
            placeholder:"Thema suchen, z. B. Migration, Klima, Rente"
          }),
          h("button", {className:"btn", disabled:loading, onClick:function(){ laden(aktivePartei, tab, query); }}, "Suchen")
        ),

        h("div", {style:{marginTop:"14px"}},
          loading && h("div", {className:"loading"}, "Lädt…"),
          error && h("div", {className:"loading", style:{color:"#c0392b"}}, error),

          tab==="programm" && !loading && h(Linkblock, {
            partei:aktivePartei, feld:"programm_url",
            text:"Offizielles Parteiprogramm", leer:"Programm-Link wird noch ergänzt."
          }),

          tab==="presse" && !loading && h(Linkblock, {
            partei:aktivePartei, feld:"presse_url",
            text:"Pressemitteilungen der Partei", leer:"Presse-Link wird noch ergänzt."
          }),

          tab==="personen" && items && (items.length
            ? items.map(function(m,i){
                return h("div", {className:"item", key:i},
                  h("h3", null, m.politiker || "—"),
                  h("div", {className:"meta"}, [m.parlament, m.fraktion].filter(Boolean).join(" · ")),
                  m.aw_url && h("a", {className:"quelle", href:"https://www.abgeordnetenwatch.de"+m.aw_url, target:"_blank", rel:"noopener"}, "Profil & Abstimmungen ansehen →")
                );
              })
            : h("div", {className:"empty"}, "Keine Mandate gefunden.")),

          (tab==="reden"||tab==="drucksachen") && items && (items.length
            ? items.map(function(t,i){
                return h("div", {className:"item", key:i},
                  h("h3", null, t.titel || "—"),
                  h("div", {className:"meta"}, [t.typ, t.datum].filter(Boolean).join(" · ")),
                  t.fundstelle && h("a", {className:"quelle", href:t.fundstelle, target:"_blank", rel:"noopener"}, "Originaldokument (PDF) →")
                );
              })
            : h("div", {className:"empty"}, "Keine Treffer – anderen Suchbegriff probieren.")),

          (tab==="reden"||tab==="drucksachen") && aktivePartei && !aktivePartei.im_bundestag && !loading &&
            h("div", {className:"empty"},
              aktivePartei.name + " ist nicht im Bundestag vertreten – nutze hier den Reiter Presse / Aktuelles."),

          tab==="einordnung" && einordnung && !loading && (
            (einordnung.amtlich.length === 0 && einordnung.themen.length === 0)
              ? h("div", {className:"empty"}, "Für diese Partei liegen noch keine Einordnungen vor.")
              : h("div", null,
                  einordnung.amtlich.length > 0 && h("h3", {className:"abschnitt"}, "Verfassungsschutz, Gerichte & Wissenschaft"),
                  einordnung.amtlich.map(function(e,i){
                    return h("div", {className:"item", key:"a"+i},
                      h("p", null, e.text),
                      h(Quellen, {datum:e.datum, quellen:e.quellen})
                    );
                  }),
                  einordnung.themen.length > 0 && h("h3", {className:"abschnitt", style:{marginTop:"18px"}}, "Themenpositionen"),
                  einordnung.themen.map(function(e,i){
                    return h("div", {className:"item", key:"t"+i},
                      h("h3", {style:{fontSize:"1rem"}}, e.thema),
                      h("p", null, e.text),
                      h(Quellen, {quellen:e.quellen})
                    );
                  })
                )
          )
        )
      ),

      !aktivePartei && h("div", {className:"card empty"}, "Bitte oben eine Partei auswählen.")
    );
  }

  // ── Render: Themen (flache, alphabetische Liste mit Suche) ────────────────
  function renderThemen() {
    if (themaSel) {
      return h("div", null,
        h("div", {className:"card"},
          h("button", {className:"backlink", onClick:zurueckZurListe}, "← Alle Themen"),
          h("h2", {className:"thema-titel"}, themaSel.titel),
          h("div", {className:"thema-context"}, "Ressort: " + themaSel.ministerium)
        ),

        vLoading && h("div", {className:"card loading"}, "Lädt…"),

        vergleich && !vLoading && h("div", {className:"card"},
          vergleich.map(function(p,i){
            return h("div", {className:"item", key:i},
              h("h3", null,
                h("span", {className:"dot", style:{background:FARBEN[p.partei_id]||"#999"}}),
                p.partei
              ),
              p.text
                ? h("p", null, p.text)
                : h("p", {style:{color:"var(--muted)"}}, "Keine eigenständige Position im Programm hervorgehoben."),
              p.quelle && h("div", {className:"meta"},
                "Quelle: ",
                h("a", {href:p.quelle.url, target:"_blank", rel:"noopener"}, p.quelle.name)
              )
            );
          })
        )
      );
    }

    var q = themenQuery.trim().toLowerCase();
    var gefiltert = themenliste.filter(function(it){
      if (!q) return true;
      return (it.titel + " " + it.ministerium).toLowerCase().indexOf(q) !== -1;
    });

    return h("div", null,
      h("div", {className:"card"},
        h("label", {className:"feldlabel"}, "Thema suchen"),
        h("div", {className:"searchrow"},
          h("input", {
            value: themenQuery,
            onChange: function(e){ setThemenQuery(e.target.value); },
            placeholder: "z. B. Rente, Tempolimit, Mietrecht, Migration …"
          }),
          themenQuery && h("button", {className:"clearbtn", onClick:function(){ setThemenQuery(""); }}, "×")
        ),
        themenliste.length > 0 && h("div", {className:"themen-zaehler"},
          gefiltert.length + " von " + themenliste.length + " Themen")
      ),

      h("div", {className:"card"},
        themenliste.length === 0
          ? h("div", {className:"empty"}, "Themen werden geladen…")
          : gefiltert.length === 0
            ? h("div", {className:"empty"}, "Kein Thema gefunden – anderen Suchbegriff probieren.")
            : h("div", {className:"themenliste"},
                gefiltert.map(function(it, i){
                  return h("button", {
                    key: i,
                    className: "thema-eintrag",
                    onClick: function(){ ladeThema(it); }
                  },
                    h("span", {className:"thema-eintrag-titel"}, it.titel),
                    h("span", {className:"thema-eintrag-ressort"}, it.ministerium)
                  );
                })
              )
      )
    );
  }

  return h("div", {className:"wrap"},

    h("header", null,
      h("h1", null, "Parteien-Informationsportal"),
      h("p", null, "Programme, Reden, Personen und Themen von A–Z – mit Verweis auf die Originalquelle.")
    ),

    !konfiguriert && h("div", {className:"card warn"},
      h("strong", null, "Einrichtung nötig: "),
      "Trage im Quelltext bei WORKER_URL die Adresse deines Cloudflare Workers ein."
    ),

    h("div", {className:"modus"},
      h("button", {
        className: ansicht==="partei" ? "active" : "",
        onClick: function(){ wechsleAnsicht("partei"); }
      }, "Einzelne Partei"),
      h("button", {
        className: ansicht==="vergleich" ? "active" : "",
        onClick: function(){ wechsleAnsicht("vergleich"); }
      }, "Themen A–Z")
    ),

    ansicht === "partei" ? renderPartei() : renderThemen(),

    h("footer", null,
      "Quellen: Deutscher Bundestag (DIP) · abgeordnetenwatch.de (CC0) · offizielle Partei-Websites und -Programme. " +
      "Diese App stellt Primärquellen und dokumentierte Einordnungen Dritter neutral dar und nimmt keine eigene Wertung vor.")
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
